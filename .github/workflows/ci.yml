name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      # The private backend is a submodule of its own, with its own lockfile and
      # its own deployment. Nothing here needs it, and no CI token can read it.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # keytar links against libsecret, and the runner image ships neither the
      # headers nor a prebuild for this Electron ABI.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Release pipeline preflight
        run: node scripts/release/preflight.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # Scoped to the app and what it depends on. The marketing site is built
      # and deployed by its own host, and a failure there is not a reason to
      # block a change to the IDE.
      - run: pnpm turbo run build --filter=@construct/desktop...

      # The build can succeed and still ship something that opens a blank
      # window. This is the check for that.
      - run: pnpm --filter @construct/desktop verify:build
