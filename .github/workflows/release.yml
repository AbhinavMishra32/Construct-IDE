name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.8.0. Must already exist."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: false

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      # A tag that disagrees with the manifests produces installers whose in-app
      # version does not match the release they were downloaded from, and an
      # updater that never settles. Fail here instead.
      - name: Check the tag matches the manifests
        run: |
          EXPECTED="${{ steps.tag.outputs.version }}"
          for manifest in package.json apps/desktop/package.json; do
            ACTUAL="$(node -p "require('./${manifest}').version")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::${manifest} is at ${ACTUAL} but the tag says ${EXPECTED}"
              exit 1
            fi
          done

      # Release notes are written by hand and read twice: stamped into the update
      # feed at package time, and used as the body of the GitHub release. A tag
      # with no notes would ship an update nobody can read.
      - name: Check the release notes exist
        run: test -s "docs/releases/${{ steps.tag.outputs.version }}.md"

      - run: node scripts/release/preflight.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm turbo run build --filter=@construct/desktop...
      - run: pnpm --filter @construct/desktop verify:build

  package:
    name: Package ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            flag: "--mac"
          - platform: windows
            os: windows-2025
            flag: "--win"
          - platform: linux
            os: ubuntu-24.04
            flag: "--linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # keytar links against libsecret, and the runner image ships neither the
      # headers nor a prebuild for this Electron ABI.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@construct/desktop...

      # Packaging is happy to wrap a build that opens a blank window. This is the
      # gate for that, run on every platform because each one packages its own.
      - name: Verify the built output can launch
        run: pnpm --filter @construct/desktop verify:build

      # node-pty and keytar are compiled against Node's ABI by `pnpm install`, and
      # Electron's is a different one.
      - name: Rebuild native modules for Electron
        run: pnpm --filter @construct/desktop rebuild:native

      # Signing is optional for this distribution. When identities are configured
      # we use them; otherwise auto-discovery is turned off, so an unsigned build
      # is deliberate and repeatable rather than dependent on whatever happens to
      # be in a runner keychain.
      - name: Package
        working-directory: apps/desktop
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID_INPUT: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_INPUT: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_INPUT: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID_INPUT" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD_INPUT" ] && [ -n "$APPLE_TEAM_ID_INPUT" ]; then
              export CSC_LINK="$MACOS_CERTIFICATE_BASE64"
              export CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
              export APPLE_ID="$APPLE_ID_INPUT"
              export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_INPUT"
              export APPLE_TEAM_ID="$APPLE_TEAM_ID_INPUT"
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              echo "::warning title=Unsigned macOS build::No Developer ID identity is configured. Users will have to open the downloaded app past Gatekeeper by hand, and automatic updates can be unavailable."
            fi
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            if [ -n "$WINDOWS_CERTIFICATE_BASE64" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
              export CSC_LINK="$WINDOWS_CERTIFICATE_BASE64"
              export CSC_KEY_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              echo "::warning title=Unsigned Windows build::No Authenticode identity is configured. SmartScreen will ask for manual approval."
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # electron-builder is invoked directly rather than through a package
          # script: forwarding flags through `pnpm run package -- --publish never`
          # does not reach it, and electron-builder publishes by default on CI
          # when a tag is present — so a dropped flag means every matrix job
          # races to publish, and fails on a token it was never given.
          pnpm exec electron-builder ${{ matrix.flag }} --publish never \
            -c.releaseInfo.releaseNotesFile="../../docs/releases/${RELEASE_VERSION}.md"

      # This YAML is the updater API. An installer can exist while the feed is
      # missing notes or an architecture, so check the contract before uploading
      # anything a running copy of Construct could discover.
      - name: Verify update feed
        working-directory: apps/desktop
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos) FEED=dist-release/latest-mac.yml ;;
            windows) FEED=dist-release/latest.yml ;;
            linux) FEED=dist-release/latest-linux.yml ;;
          esac
          test -s "$FEED"
          grep -q "^version: ${{ needs.verify.outputs.version }}$" "$FEED"
          grep -q "^releaseNotes:" "$FEED"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            grep -q -- "-arm64-mac.zip" "$FEED"
            grep -q -- "-mac.zip" "$FEED"
          fi

      # latest*.yml is what electron-updater reads, so it is a release asset like
      # any installer, not a build leftover. The blockmaps beside it are what
      # makes an update a delta rather than a second full download.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: construct-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/dist-release/*.dmg
            apps/desktop/dist-release/*.zip
            apps/desktop/dist-release/*.exe
            apps/desktop/dist-release/*.AppImage
            apps/desktop/dist-release/*.deb
            apps/desktop/dist-release/latest*.yml
            apps/desktop/dist-release/*.blockmap

  publish:
    name: Publish release
    needs: [verify, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: false

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_ARTIFACT_DIR: release-artifacts
        run: |
          ls -la release-artifacts
          node scripts/release/publish-gh.mjs
